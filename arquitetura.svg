<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Amazon Bedrock · Arquitetura do projeto RAG</title>
<desc id="d">Assistente da IA Expert Academy construído com RAG no Amazon Bedrock, na região us-east-1. Os PDFs (IA Expert Academy e Termos de uso) são enviados ao bucket S3 curso-bedrock-s3. Ao sincronizar, a Knowledge Base knowledge-base-quick-start-2d1lr (ID 4SCLDZ9ZTH, tipo Bedrock Managed) divide os documentos em trechos, gera os embeddings e armazena os vetores de forma gerenciada. No computador local, o usuário acessa a aplicação Streamlit (app.py) em localhost:8501. A função ask chama o retrieve do bedrock-agent-runtime com managedSearchConfiguration, recebe os trechos com score e página, monta o prompt com o contexto e chama o converse do bedrock-runtime com o modelo Amazon Nova Micro (us.amazon.nova-micro-v1:0). A resposta aparece no chat com as fontes e fica salva no session_state. As credenciais IAM são lidas de um arquivo CSV fora do código. No notebook de estudo, o Amazon Titan Text Embeddings V2 gera vetores de 1024 dimensões, usados para visualização com PCA e busca por similaridade de cosseno.</desc>
<defs>
