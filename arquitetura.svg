  <text x="62" y="1040">O usuário digita a pergunta no chat da aplicação Streamlit.</text>
  <text x="62" y="1070">A função ask chama o retrieve da Knowledge Base com a pergunta.</text>
  <text x="62" y="1100">A busca devolve os trechos mais relevantes, com score e página.</text>
  <text x="62" y="1130">O app monta o prompt (contexto + pergunta) e chama o converse.</text>
  <text x="62" y="1160">O Nova Micro responde; o chat mostra a resposta e as fontes.</text>
  <text x="742" y="1040">Os PDFs são enviados ao bucket S3 pelo Console da AWS.</text>
  <text x="742" y="1070">No sync, a base faz chunking, embeddings e indexação dos trechos.</text>
  <text x="742" y="1100">No notebook, o Titan gera os vetores estudados com PCA e cosseno.</text>
  <text x="722" y="1133" font-size="11.5" fill="#545B64">Obs.: a base Bedrock Managed não aceita retrieve_and_generate,</text>
  <text x="722" y="1149" font-size="11.5" fill="#545B64">por isso o RAG é feito em duas chamadas: retrieve + converse.</text>
</g>
</svg>
